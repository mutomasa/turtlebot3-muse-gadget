[project]
name = "turtlebot3-muse-gadget"
version = "0.1.0"
description = "Connect TurtleBot3 Burger to Muse as a robot gadget via ROS 2 and the Muse Gadget SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
map = ["pillow>=10"]

[project.scripts]
turtlebot-muse-status-cli = "turtlebot3_muse.status_cli:main"
turtlebot-muse-map-cli = "turtlebot3_muse.map_cli:main"

[dependency-groups]
dev = ["pytest>=8", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turtlebot3_muse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
