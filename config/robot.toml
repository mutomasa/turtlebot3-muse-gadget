# TurtleBot3 Muse Gadget 設定
# ROS_DOMAIN_ID や RMW_IMPLEMENTATION はラッパースクリプト（scripts/turtlebot-muse-*）の環境変数で指定する。

robot_name = "TurtleBot3 Burger"

[topics]
odom = "/odom"
scan = "/scan"
battery = "/battery_state"
map = "/map"

[status]
wait_timeout_s = 4.0     # ワンショット購読の最大待機時間
max_age_s = 2.0          # 受信後この秒数を超えたら stale
max_stamp_skew_s = 5.0   # ヘッダ時刻と壁時計の差がこれを超えたら警告（時刻同期が不明なため鮮度判定には使わない）

[map]
wait_timeout_s = 5.0
tf_timeout_s = 2.0
map_frame = "map"
base_frame = "base_link"
transient_local = true   # slam_toolbox / cartographer / map_server は Transient Local で配信する
max_side_px = 1024
max_image_bytes = 2097152  # Muse の画像上限 2 MiB

[muse]
binary = "musegadget"
send_timeout_s = 15.0

[bridge]
# 常駐ブリッジ（systemd/turtlebot3-muse-bridge.service）の Unix ソケット。
# robot.status はまずここに問い合わせ、応答がなければワンショット購読にフォールバックする。
socket_path = "/run/turtlebot-muse/bridge.sock"
request_timeout_s = 1.0

[view]
# robot.view が撮影する、画面なし RViz2（systemd/turtlebot3-muse-rviz.service）の Xvfb ディスプレイ。
# display はサービス側の TURTLEBOT_MUSE_RVIZ_DISPLAY_NUM と合わせる。
display = ":99"
xauthority = "/run/turtlebot-muse-rviz/xauth"
ffmpeg = "ffmpeg"
capture_timeout_s = 5.0
max_image_bytes = 2097152
